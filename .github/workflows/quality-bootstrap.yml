name: Bootstrap Strengthened Code Quality

on:
  pull_request:
    branches:
      - feature/v1.1

permissions:
  contents: read

jobs:
  bootstrap:
    name: Resolve dependencies and exercise quality rules
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dot/typed-eslint-prettier'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --lockfile-only --ignore-scripts --strict-peer-dependencies
      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - name: Format tooling only
        run: pnpm exec prettier --write .prettierrc.json eslint.config.mjs docs/code-quality.md package.json
      - uses: actions/upload-artifact@v7
        with:
          name: strengthened-quality-files
          path: |
            pnpm-lock.yaml
            .prettierrc.json
            eslint.config.mjs
            docs/code-quality.md
            package.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Verify the changed-file gate
        run: pnpm quality:changed HEAD^1
      - name: Exercise the configured rules and formatter
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { writeFile, unlink } from 'node:fs/promises'
          import { ESLint } from 'eslint'
          import { check, format, resolveConfig } from 'prettier'

          const probes = {
            "src/quality-style-rules.tsx": "import { ReactNode } from 'react'\nimport { useEffect, useState } from 'react'\n\nexport function Probe({ enabled, value }: { enabled: boolean; value: number }): ReactNode {\n  if (enabled) useState(0)\n  useEffect(() => { console.log(value) }, [])\n  return null\n}\n",
            "server/src/quality-style-rules.ts": "export async function Probe(value: 'a' | 'b') {\n  await 1\n  Promise.resolve(1)\n  switch (value) { case 'a': return 1 }\n}\n",
            "quality-style-rules.mjs": "var state = 1\nlet value = 2\nexport function check() { return state == value }\nexport function absent(input) { return input == null }\nexport function branch(input) {\n  switch (input) {\n    case 1:\n      state += 1\n    case 2:\n      return state\n  }\n}\n"
          }
          const expected = {
            'src/quality-style-rules.tsx': ['@typescript-eslint/consistent-type-imports', 'react-hooks/rules-of-hooks', 'react-hooks/exhaustive-deps'],
            'server/src/quality-style-rules.ts': ['@typescript-eslint/await-thenable', '@typescript-eslint/no-floating-promises', '@typescript-eslint/switch-exhaustiveness-check'],
            'quality-style-rules.mjs': ['no-var', 'prefer-const', 'eqeqeq', 'no-fallthrough'],
          }
          const created = []
          try {
            for (const [path, source] of Object.entries(probes)) {
              await writeFile(path, source, { flag: 'wx' })
              created.push(path)
            }
            const eslint = new ESLint()
            for (const result of await eslint.lintFiles(created)) {
              const path = created.find((file) => result.filePath.endsWith('/' + file))
              assert.ok(path, result.filePath)
              assert.equal(result.fatalErrorCount, 0, JSON.stringify(result.messages))
              for (const rule of expected[path]) {
                assert.ok(result.messages.some((msg) => msg.ruleId === rule && msg.severity === 2), JSON.stringify(result.messages))
              }
              if (path === 'quality-style-rules.mjs') {
                assert.equal(result.messages.filter((msg) => msg.ruleId === 'eqeqeq').length, 1)
              }
              console.log(path, expected[path].join(', '))
            }
            const conforming = "const fn = (x) => ({ x, label: 'x' })\n"
            const bad = 'const fn=(x)=>({x,label:"x"});\r\n'
            const options = { ...await resolveConfig('quality-style-rules.mjs'), filepath: 'quality-style-rules.mjs' }
            assert.equal(await check(bad, options), false)
            assert.equal(await format(bad, options), conforming)
            assert.equal(await check(conforming, options), true)
            console.log('Prettier rejects nonconforming input and matches the expected style.')
          } finally {
            for (const file of created) await unlink(file)
          }
          NODE
